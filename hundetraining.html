var CHAPTERS = [{"id": "beziehung", "num": "01", "short": "Beziehung & Grundhaltung", "title": "Beziehung & Grundhaltung", "subtitle": "Die Basis der gesamten Trainingsarbeit", "bg": "ch-beziehung", "sections": [{"heading": "Wer bewegt wen?", "tag": "Grundhaltung", "content": "Die Leitfrage der ersten Phase lautet \u201eWer bewegt wen?\u201c \u2013 sie zieht sich durch die gesamte Trainingsarbeit. Entscheidend ist ein Bewusstsein daf\u00fcr, in welchen Situationen bereits Verbindlichkeit verlangt werden kann und wann besser auf Management zur\u00fcckgegriffen wird, damit der Hund seinen Menschen als handlungsf\u00e4hig erlebt.\n\nIn den ersten Tagen ertappt man sich h\u00e4ufig dabei, verbale Vorgaben zu machen, die der Hund (noch) nicht ernst nimmt. Genau beobachten: Wann verwickelt der Hund in Diskussionen, und welches Verhalten l\u00e4sst sich tats\u00e4chlich schon nachhaltig unterbinden? Sinnvoll ist auch, sich vorab zu \u00fcberlegen, was in welcher Situation konkret erwartet wird \u2013 das erm\u00f6glicht langfristig ein klareres Auftreten."}, {"heading": "Trennung von Erziehung und Management", "tag": "Prinzip", "content": "In der ersten Zeit gilt eine strikte Trennung von Erziehung und Management. Empfehlung: bis zum n\u00e4chsten Termin so weit wie m\u00f6glich auf Kommandos und Strafen verzichten. Die eigenen Worte sollen wieder an Bedeutung gewinnen \u2013 deshalb wird der Einsatz der Stimme vorerst auf ein Minimum reduziert. Zusammen mit den Umstrukturierungen im h\u00e4uslichen Bereich und auf den Spazierg\u00e4ngen bildet das den Grundstein f\u00fcr die n\u00e4chsten Schritte.", "quote": "Wie bew\u00e4ltige ich diese Situation, ohne dass mich mein Hund in einen Konflikt verwickelt, den ich unter Umst\u00e4nden noch nicht l\u00f6sen kann?", "quoteLabel": "Reflexionsfrage vor jeder Interaktion"}, {"heading": "Langfristiges Ziel", "tag": "Ziel", "content": "Ziel ist eine nachhaltige Ver\u00e4nderung der Beziehungsstruktur \u2013 eine gesunde Hierarchie, in der Zust\u00e4ndigkeiten und Verantwortungsbereiche f\u00fcr beide Seiten klar definiert sind. Bevor die Arbeit an einer Streitkultur beginnt (Stellvertreterkonflikte), wird der Hund \u00fcber selbstdarstellerische Ma\u00dfnahmen sensibilisiert: wasserdichtes Management und das Aufbrechen ritualisierter Abl\u00e4ufe.\n\nDer Hund wird dabei vor vollendete Tatsachen gestellt, \u00fcber die er nicht verhandeln kann. Die Entscheidung ist fix. F\u00fcr den Menschen l\u00e4uft das diskussionsfrei ab \u2013 lediglich der Hund befindet sich im inneren Konflikt und entwickelt dabei oft neue Konfliktl\u00f6sestrategien und Selbstregulation."}, {"heading": "Beispiel: Management \u00fcber den Fu\u00df auf der Leine", "tag": "Beispiel", "content": "Was auf Beziehungsebene wirkt, ist individuell. Ein Beispiel: der Fu\u00df auf der Leine. Man kann sich dadurch abgegrenzt unterhalten und dem Gespr\u00e4ch folgen, ohne st\u00e4ndig nach dem Hund zu schauen. Ohne Diskussion und ohne aktiv zu werden, entscheidet man \u00fcber Ort, Position und Dauer des Aufenthalts \u2013 und nimmt Einfluss auf die Stimmung. Der Hund wird so auf k\u00f6rperlich-r\u00e4umlicher und auf emotionaler Ebene bewegt, obwohl man klar im Management bleibt und noch nicht erzieherisch t\u00e4tig wird."}, {"heading": "Selbstdarstellerische Ma\u00dfnahmen", "tag": "Massnahmen", "content": "Ziel ist keine totale Verwirrung, sondern eine leicht erh\u00f6hte Aufmerksamkeit \u2013 der Hund soll seinen Menschen st\u00e4rker wahrnehmen und dessen Handlungsf\u00e4higkeit registrieren. Die folgenden Beispiele dienen als Inspiration; eigene Ideen sind ausdr\u00fccklich erw\u00fcnscht.", "numbered": [{"title": "Begehrte T\u00e4tigkeit vor dem Hund ausf\u00fchren", "text": "Z.B. das Lieblingsspielzeug hin und her werfen und den Hund dabei anleinen oder den Fu\u00df auf die Leine stellen.", "tip": "Intensit\u00e4t so w\u00e4hlen, dass es nicht in v\u00f6lligem Frust ausartet. Er darf frusten, aber nur so weit, dass kein Eingreifen n\u00f6tig ist."}, {"title": "Hund bei Alltagst\u00e4tigkeiten mitschleifen", "text": "Beim Haushalt (Sp\u00fclmaschine, Fenster putzen, Blumen gie\u00dfen, W\u00e4sche\u2026) oder im Homeoffice f\u00fcr Minuten bis Stunden kommentarlos um die H\u00fcften binden bzw. \u00fcber die Schulter h\u00e4ngen."}, {"title": "Begehrte Liegepl\u00e4tze ver\u00e4ndern", "text": "Sofa oder Lieblingsk\u00f6rbchen vollstellen (Stuhl, B\u00fccher, Zeitungspapier, Alufolie\u2026), verschieben oder f\u00fcr einige Stunden komplett wegr\u00e4umen."}, {"title": "Futter aufteilen", "text": "Zun\u00e4chst nur einen Teel\u00f6ffel Futter geben, den Rest erst nach ein paar Stunden."}, {"title": "Futterort wechseln", "text": "An einem anderen Ort f\u00fcttern, z.B. in der Badewanne oder auf dem Spaziergang."}, {"title": "F\u00fctterungszeiten variieren", "text": "Zu anderen Uhrzeiten f\u00fcttern oder die Anzahl der Mahlzeiten ver\u00e4ndern."}, {"title": "Spaziergangsritual durchbrechen", "text": "Leine oder Schl\u00fcssel in die Hand nehmen (und wieder ablegen), Jacke, Schuhe und Hund anziehen (und wieder ausziehen) \u2013 ohne tats\u00e4chlich zu gehen."}, {"title": "Sofa- / Begr\u00fc\u00dfungsverbot durch Anleinen ersetzen", "text": "Statt Sofa oder Begr\u00fc\u00dfung in Besuchssituationen wird der Hund an einem strategisch ung\u00fcnstigen Platz f\u00fcr Minuten bis Stunden angeleint."}, {"title": "T\u00fcren willk\u00fcrlich schlie\u00dfen", "text": "Z.B. die Wohnzimmert\u00fcr schlie\u00dfen, w\u00e4hrend der Hund im Flur ist, oder die Terrassent\u00fcr, wenn der Hund im Garten ist \u2013 und erst nach einiger Zeit wieder \u00f6ffnen."}, {"title": "Liegeplatz wechseln lassen", "text": "Den bequem liegenden Hund am Halsband an eine andere Stelle f\u00fchren (z.B. mitten in den Raum), kommentarlos abstellen, dann die eigene T\u00e4tigkeit fortsetzen."}, {"title": "Nach dem Spaziergang im Auto lassen", "text": "Den Hund nach dem Spaziergang eine Zeit lang im Auto lassen und erst sp\u00e4ter mit hineinnehmen \u2013 sofern die Temperaturen es zulassen."}]}, {"heading": "Dosierung & Durchf\u00fchrung", "tag": "Wichtig", "content": "Nicht zu viel auf einmal \u2013 sonst ist es nicht glaubw\u00fcrdig und verliert den Effekt. Zwei bis drei Kleinigkeiten pro Tag reichen. Bei Punkt 4, 5 und 6 mehrere Tage Pause zwischen den Ma\u00dfnahmen lassen.\n\nBei Punkt 1, 8, 9 und 10 werden keine Verbote ausgesprochen und keine Kommandos gegeben \u2013 das birgt Diskussionspotenzial. Stattdessen: zum Hund gehen, ihn kommentarlos im Nacken, am Halsband oder an einer Hausleine mitnehmen und am festgelegten Platz anleinen bzw. abstellen. Er wird auch nicht gebeten mitzukommen. Gleiches gilt f\u00fcr Punkt 2 \u2013 w\u00e4hrend dieser Zeit wird gar nicht auf den Hund eingegangen.", "quote": "Weniger reden, mehr handeln.", "quoteLabel": "Leitmotiv der selbstdarstellerischen Ma\u00dfnahmen"}, {"heading": "Haltung: Wohlwollen statt H\u00e4rte", "tag": "Grundhaltung", "content": "Jede Handlung wird mit Wohlwollen ausgef\u00fchrt. Es geht nicht darum, den Hund kleiner zu machen \u2013 mit H\u00e4rte kommt man in der Beziehungsarbeit nicht weit. Im Kern geht es um liebevolle Bestimmtheit und Ernsthaftigkeit: Dinge so meinen, wie man sie sagt, und wirklich hinter dem stehen, was man vorgibt.\n\nHunde mit hohem Status innerhalb einer Gruppe tragen viel Verantwortung, sind aber kaum in gro\u00dfe Konflikte verwickelt und treffen dennoch die wichtigen Entscheidungen. Sie m\u00fcssen sich nicht durchsetzen \u2013 ihr souver\u00e4nes Auftreten und die Stimmung, die sie erzeugen, gen\u00fcgen."}, {"heading": "Was zu erwarten ist", "tag": "Hinweis", "content": "Im Rahmen der Beziehungsarbeit kann es zu einer Erstverschlimmerung kommen. M\u00f6glich ist auch, dass der Hund vorgibt, ihm seien die Ma\u00dfnahmen v\u00f6llig egal \u2013 davon nicht beirren lassen. Gerade wenn Hunde Gleichg\u00fcltigkeit signalisieren, bewegt sich im Inneren oft besonders viel.\n\nBeziehungsarbeit ist kein 10-14-Tage-Programm, sondern die Entwicklung einer inneren Haltung, die gelebt werden muss. Das ist ein Prozess."}]}, {"id": "stellvertreter", "num": "02", "short": "Stellvertreterkonflikte", "title": "Stellvertreterkonflikte", "subtitle": "Im Kleinen streiten lernen \u2013 eine Stimme f\u00fcr die Hauptkonflikte", "bg": "ch-stellvertreter", "sections": [{"heading": "Worum es geht", "tag": "Prinzip", "content": "Durch das L\u00f6sen von Stellvertreterkonflikten erarbeiten wir uns eine Stimme f\u00fcr die Hauptkonflikte. Es geht darum, sich mit dem Hund im Kleinen streiten zu lernen, um sein Verhalten sp\u00e4ter auch in h\u00f6heren Erregungslagen beeinflussen zu k\u00f6nnen.\n\nDer Mensch entscheidet \u00fcber Thema und Umfang einer Auseinandersetzung. Eine Diskussion wird planvoll gef\u00fchrt und zu den Bedingungen des Menschen gestaltet. Er tritt handlungssicher und durchsetzungsf\u00e4hig auf und erarbeitet sich dadurch Standing und Verbindlichkeit. Wichtig ist, die Rahmenbedingungen vor Konfliktbeginn klar abzustecken. Stellvertreterkonflikte sollen dem Hund so wenig Verhandlungsspielraum wie m\u00f6glich bieten."}, {"heading": "Wiederholungen sind das Wichtigste", "tag": "Kernregel", "content": "Achte auf korrekte Wiederholungen, sodass du nach einer Strafe mehrere fehlerfreie Durchl\u00e4ufe hintereinander erreichst \u2013 idealerweise zwei bis acht Mal in Folge.\n\nWiederholungen nach dem Durchsetzen \u00fcberpr\u00fcfen zweierlei: ob der Hund verstanden hat, wof\u00fcr er gestraft wurde (er bekommt die M\u00f6glichkeit, selbstwirksam zu sein), und ob die Strafe ankam und er nun ehrliche Akzeptanz gegen\u00fcber der Vorgabe zeigt. Nur so l\u00e4sst sich das Ziel erreichen, Vorgaben langfristig nur noch selten durchsetzen zu m\u00fcssen \u2013 also fast ohne Strafen auszukommen und eine Korrekturspirale zu durchbrechen.", "quote": "Reagiert der Hund in der ersten Wiederholung sofort, war die Strafintensit\u00e4t ausreichend und das Setting passt. Reagiert er nicht, folgt eine Strafe in h\u00f6herer Intensit\u00e4t.", "quoteLabel": "Pr\u00fcfstein nach dem Durchsetzen"}, {"heading": "Sensibilisieren, nicht abstumpfen", "tag": "Wichtig", "content": "Das Ergebnis einer \u00dcbung sollte niemals sein, immer doller werden zu m\u00fcssen, um den Hund zu erreichen \u2013 ganz im Gegenteil. Langfristig sollen niedrigere Intensit\u00e4ten reichen, um eine Ansprache durchzusetzen.\n\nDamit das klappt: die \u00dcbung in einem passenden Setting umsetzen (Schwierigkeit nicht zu hoch) und mit der Bestrafung direkt in h\u00f6herer Intensit\u00e4t einsteigen, um einer Gew\u00f6hnung entgegenzuwirken. Man sollte sicher sein, die Vorgabe ohne Gefahr einer Korrekturspirale durchsetzen zu k\u00f6nnen. Ein kleinschrittiger Aufbau mit Blick auf das, was der Hund schon leisten kann, ist essenziell."}, {"heading": "Laborbedingungen: Es bleibt alles wie es ist", "tag": "Prinzip", "content": "Durch gestellte Konflikte schaffen wir \u201eLaborbedingungen\u201c, die beinahe identische Wiederholungen erm\u00f6glichen. Beim stabilen Stehen etwa wird der Hund nach einem Fehler immer wieder an die exakt gleiche Stelle platziert. Ortswechsel stellen f\u00fcr den Hund eine Kontextver\u00e4nderung dar \u2013 Mensch und Hund w\u00e4ren sofort in einem neuen Konflikt, ohne dass der urspr\u00fcngliche zu Ende besprochen wurde.\n\nDeshalb ist wichtig, sich zu merken, wo genau man gestraft hat und wie der Kontext aussah. Auch eine ablenkende Person sollte in den Wiederholungen nicht n\u00e4her ran oder weiter weg gehen.", "quote": "Es bleibt alles so, wie es ist!", "quoteLabel": "Grundregel beim Wiederholen"}, {"heading": "Zwei weitere Grundregeln", "tag": "Wichtig", "content": "Den Hund nach einer Strafe nicht loben. Der Mensch verh\u00e4lt sich nach einem Abbruch neutral und nutzt Belohnungen erst wieder, wenn der Hund die Vorgabe sauber ausgef\u00fchrt hat.\n\nSchwierigkeit und Dauer einer \u00dcbung nicht gleichzeitig erh\u00f6hen.\n\nT\u00e4glich einige der \u00dcbungen einstreuen. Auch die selbstdarstellerischen Ma\u00dfnahmen noch nicht vollst\u00e4ndig runterfahren \u2013 Selbstdarstellung und Stellvertreterkonflikte erg\u00e4nzen sich gut."}, {"heading": "Stabiler Stand des Menschen", "tag": "Uebung", "content": "Die F\u00fc\u00dfe etwa h\u00fcftbreit und gerade nach vorne ausgerichtet unter den K\u00f6rperschwerpunkt stellen. Die Zehenspitzen zeigen weder nach au\u00dfen noch nach innen. Der Oberk\u00f6rper ist aufrecht, aber nicht verkrampft, die Schultern h\u00e4ngen locker herunter.\n\nWichtig ist vor allem eine Streckung der Brustwirbels\u00e4ule \u2013 dabei nicht die Schulterbl\u00e4tter zusammenziehen, sondern die oberen R\u00fcckenmuskeln aktivieren. Der Blick geht nach oben, das Kinn parallel zum Boden."}, {"heading": "Stabiles Stehen mit Hund", "tag": "Uebung", "content": "Aufgabenstellung: \u201eHalte deinen Hund bei dir \u2013 ohne Handzeichen, akustische Signale, Futterbestechung, ihm ins Halsband bzw. Geschirr zu greifen oder ihn an der Leine festzuhalten.\u201c\n\nDer Mensch steht selbst im stabilen Stand und grenzt sich ab (Blick nach oben, Hund nur peripher wahrnehmen). Der Hund wird nur zu Beginn \u00fcber die Leine rangeangelt, falls er auf die k\u00f6rpersprachliche Einladung nicht in den Nahbereich kommt \u2013 danach nur noch \u00fcber k\u00f6rperliche Einschr\u00e4nkungen (Griff vor die Brust, in den Nacken oder die Flanke) gehalten. Die Leine h\u00e4ngt ab dem Formen locker durch; am besten umh\u00e4ngen, um beide H\u00e4nde frei zu haben.\n\nDer Hund steht so nah, dass kein Ausfallschritt n\u00f6tig ist, wenn er ausbrechen will \u2013 aber mit kleinem Abstand, da viele Hunde den Beinkontakt als Co-Regulativ nutzen. Anders als beim Andocken soll hier die Selbstregulation geschult werden: Der Hund findet frei und ohne Ber\u00fchrungshilfe in die Stabilit\u00e4t. Nach dem Ausrichten d\u00fcrfen sich die Pfoten nicht mehr bewegen (wie einbetoniert) \u2013 einzelne Pfotentritte sind wichtig zu beachten, denn hier beginnen die Diskussionen dar\u00fcber, wer R\u00e4ume verwaltet.", "quote": "Ist der Mensch nicht handlungs- und durchsetzungsf\u00e4hig, wird gemanagt (Griff ins Halsband, Fu\u00df auf die Leine), statt einen sozialen Konflikt aufzumachen. Stabiles Stehen nur \u00fcben, wenn Zeit, Nerven und Setting passen.", "quoteLabel": "Voraussetzung"}, {"heading": "Stabiles Stehen \u2013 Anleitung", "tag": "Anleitung", "content": "In 5er- oder 10er-Schritten die Sekunden erh\u00f6hen. Erst wenn der Hund mehrere Sekunden stabil steht, Ablenkungen reinbringen.", "numbered": [{"title": "Aufstellen", "text": "Dauer der \u00dcbung \u00fcberlegen, \u00dcbungspunkt suchen und dort in den stabilen Stand stellen."}, {"title": "Hund ranholen", "text": "Leine umh\u00e4ngen und den Hund \u00fcber die Leine ranangeln bzw. per Handgeste in den Nahbereich einladen."}, {"title": "Ausrichten", "text": "Hund auf einer festgelegten Seite platzieren, Vor- und Hinterhand parallel zum eigenen Bein ausrichten."}, {"title": "Abgrenzen", "text": "Oberk\u00f6rper aufrichten, tief durchatmen, Blick nach vorne, gedanklich vom Hund l\u00f6sen \u2013 ihn nur peripher wahrnehmen."}, {"title": "Halten", "text": "Der Hund darf schn\u00fcffeln und sich umschauen, solange die Pfoten stillstehen. Bewegt er eine Pfote \u2192 schneller, beherzter Griff zur k\u00f6rperlichen Einschr\u00e4nkung. Setzt er sich \u2192 unter den Bauch greifen und wieder ordentlich hinstellen."}, {"title": "Wiederholen", "text": "Ohne gestellte Ablenkung: kurz abwarten, aufl\u00f6sen, neu positionieren, in die Wiederholung. Mit gestellter Ablenkung: diese mehrfach direkt nacheinander erneut zeigen, bevor aufgel\u00f6st und in die Wiederholung des gesamten Aufbaus gegangen wird."}, {"title": "\u00dcberpr\u00fcfen", "text": "War die Strafintensit\u00e4t ausreichend und die Ablenkung nicht zu hoch, sollte das Ziel nun mehrfach fehlerfrei erreicht werden. Sonst Intensit\u00e4t und ggf. Aufbau anpassen."}, {"title": "Nachhaltigkeitscheck", "text": "Nach mehreren fehlerfreien Wiederholungen den gesamten Aufbau nach kurzer Pause in einem anderen Setting mit \u00e4hnlicher Ablenkung wiederholen. Klappt es direkt beim ersten Mal fehlerfrei, darf die Einheit sofort beendet werden."}], "difficultyList": ["Handvoll Leckerchen vor den Hund werfen", "Ball prellen bzw. Spielzeug werfen", "Locken durch eine andere Person (stimmlich und/oder mit Futter/Spielzeug)", "Eigene Arme ruckartig bewegen (inkl. Ausruf wie \u201eHallo!\u201c) oder mit der Leine hantieren", "Umgebung mit hoher Reizlage (befahrener Radweg, Spielplatz, Wald bei D\u00e4mmerung\u2026)"]}, {"heading": "Verbindliche Ansprache im Nahbereich", "tag": "Uebung", "content": "Dieser Konflikt besteht aus drei Elementen: Ansprache, k\u00f6rpersprachliche Einladung und Verweilen im Nahbereich bis zur Aufl\u00f6sung. Fehler: Der Hund h\u00f6rt nicht bzw. verz\u00f6gert auf seinen Namen, l\u00e4sst sich nicht bzw. nicht vollst\u00e4ndig einladen oder verl\u00e4sst den Nahbereich vor der Freigabe. Bei jedem Fehler folgt eine positive Strafe (kr\u00e4ftiges \u201eEy!\u201c, Impuls an der Leine, Aufstampfen, unsanftes Anstupsen).\n\nAngesprochen wird grunds\u00e4tzlich freundlich, ohne ermahnenden Unterton. Reagiert der Hund sofort, kommt auf direktem Weg in den Nahbereich und verweilt, wird er gelegentlich belohnt \u2013 partiell und variabel (Streicheln, Leckerchen, verbal), hin und wieder ganz ausgelassen, um die Motivation hochzuhalten (Jackpot-Effekt).", "quote": "Ist der Mensch nicht handlungs- und durchsetzungsf\u00e4hig oder sind Distanz bzw. Ablenkung zu gro\u00df, auf die Ansprache verzichten und \u00fcber die Leine managen.", "quoteLabel": "Wichtig"}, {"heading": "Verbindliche Ansprache \u2013 Schema", "tag": "Schema", "numbered": [{"title": "Fehler", "text": "Name nennen (+ k\u00f6rpersprachliche Einladung) \u2192 Hund reagiert nicht = strafen & anschlie\u00dfend aufl\u00f6sen."}, {"title": "1. Wiederholung", "text": "Name + Einladung \u2192 reagiert sofort = (partiell) belohnen; reagiert nicht = nochmal strafen (gesteigerte Intensit\u00e4t) und erneut in die erste Wiederholung."}, {"title": "2.\u20138. Wiederholung", "text": "Name + Einladung \u2192 reagiert sofort = (partiell) belohnen. Sobald erneut ein Fehler passiert, beginnt das Spiel von vorne und der Wiederholungscounter geht auf null."}, {"title": "Nachhaltigkeitscheck", "text": "Gesamten Aufbau nach kurzer Pause oder sp\u00e4ter an anderer Stelle in \u00e4hnlicher Schwierigkeit wiederholen. Endergebnis: reagiert sofort = (partiell) belohnen & aufl\u00f6sen."}], "difficultyList": ["Schnuppern im Gras", "Leckerchen verteilen und den Hund suchen lassen", "Sichtung von Reizen (Katzen, andere Hunde, Fahrzeuge\u2026)", "Locken durch eine andere Person (stimmlich und/oder mit Futter/Spielzeug)"]}, {"heading": "Ansprache \u2013 wichtige Erg\u00e4nzung", "tag": "Hinweis", "content": "Wenn du deinen Hund ansprichst, muss er nur in den Nahbereich kommen, wenn du ihn k\u00f6rpersprachlich \u00fcber die Handgeste einl\u00e4dst. Schn\u00fcffelt er irgendwo und du sprichst ihn nur an, ohne ihn einzuladen, reicht es, dass er kurz Augenkontakt aufnimmt und auf Abstand auf die Freigabe wartet, weiterschn\u00fcffeln zu d\u00fcrfen. Wichtig \u2013 egal ob eingeladen oder nicht \u2013 die Freigabe muss immer erteilt werden.\n\nL\u00e4sst sich der Hund nicht motivieren, sich nochmal mit einer Schn\u00fcffelstelle zu besch\u00e4ftigen, ist das kein Problem: die Ansprache in einem Moment wiederholen, in dem er dort gelangweilt herumschaut. Das Locken durch eine andere Person ist schwierig, weil der Hund sich aus der Begr\u00fc\u00dfung bzw. Futterbestechung l\u00f6sen muss \u2013 diese daher zun\u00e4chst nicht zu \u00fcberschw\u00e4nglich gestalten, damit der Hund eine Chance hat, es richtig zu machen."}, {"heading": "Aussteigen aus dem Auto", "tag": "Uebung", "content": "Hinweis: haben wir nicht gemacht, trotzdem zur Mitgabe.\n\nDieser Konflikt unterteilt sich in mehrere Handlungsschritte: leichtes \u00d6ffnen der T\u00fcr (einen Spalt), vollst\u00e4ndiges \u00d6ffnen inkl. Freigeben des Raumes (zur Seite stellen), Aufnehmen nach der Leine, Anleinen, Sortieren der Leine und Freigeben des Raumes sowie die Einladung zum Aussteigen. Am \u00d6ffnen der T\u00fcr wird das Vorgehen im Fehlerfall erkl\u00e4rt \u2013 die Reihenfolge l\u00e4sst sich auf alle anderen Schritte \u00fcbertragen. Jeder Handlungsschritt muss (mehrfach) wiederholt werden, sollte dabei ein Fehler passieren.", "numbered": [{"title": "Fehler", "text": "Boxen-/Autot\u00fcr oder Kofferraum \u00f6ffnen \u2192 Hund dr\u00e4ngelt = strafen (z.B. T\u00fcr zuknallen oder Packen im Bereich der Schulter)."}, {"title": "1. Wiederholung", "text": "\u00d6ffnen \u2192 Hund nimmt sich zur\u00fcck und dr\u00e4ngelt nicht = (partiell) belohnen; dr\u00e4ngelt = nochmal strafen (gesteigerte Intensit\u00e4t) und erneut in die erste Wiederholung."}, {"title": "2.\u20138. Wiederholung", "text": "\u00d6ffnen \u2192 Hund nimmt sich zur\u00fcck = (partiell) belohnen. Bei erneutem Fehler geht der Wiederholungscounter zur\u00fcck auf null."}, {"title": "Nachhaltigkeitscheck", "text": "Gesamten Aufbau am gleichen Ort nach kurzer Pause oder sp\u00e4ter anderswo in \u00e4hnlicher Schwierigkeit wiederholen. Endergebnis: Hund nimmt sich zur\u00fcck = (partiell) belohnen & aufl\u00f6sen."}], "difficultyList": ["In Sichtweite einen Schritt daneben stellen", "Mit der Leine hantieren", "Mehrere Meter weit weg in Sichtweite platzieren", "Au\u00dfer Sichtweite gehen (z.B. ums komplette Auto herumlaufen)", "Andere Autot\u00fcren bet\u00e4tigen / au\u00dfer Sichtweite Schuhe wechseln", "Kekse sichtbar vor dem Auto verteilen", "Mit Spielzeug motivieren; dynamisch auf und ab laufen bzw. h\u00fcpfen (\u201eStimmung machen\u201c)"]}, {"heading": "Geformtes Sitz", "tag": "Uebung", "content": "Hinweis: haben wir nicht gemacht, trotzdem zur Mitgabe.\n\nEine Steigerung des stabilen Stehens: Ort, Dauer, K\u00f6rperform und Stimmung gibt der Mensch vor \u2013 eine noch intensivere Form der k\u00f6rperlichen Manipulation. Kann isoliert ge\u00fcbt oder zum Durchsetzen eines Sitzkommandos genutzt werden.\n\nLiebevolles Formen (kein Fehler): gleichm\u00e4\u00dfig ansteigenden, dann gehaltenen Druck auf die Hinterhand aus\u00fcben und sofort l\u00f6sen, sobald sich der Hund absetzt. Ein Griff ins Halsband verhindert das Rauswinden (Anspringen, Hinschmei\u00dfen).\n\nStrafendes Formen (nach Fehler): den Druck energischer setzen und l\u00e4nger halten \u2013 die Hand noch einen Moment auf dem Ges\u00e4\u00df liegen lassen. Bei glattem, kurzem Fell eine Hautfalte bilden, um sicher zu greifen. Steht der Hund nach dem Absetzen ohne Erlaubnis wieder auf, erst im Nacken greifen, an die urspr\u00fcngliche Stelle zur\u00fcckf\u00fchren, dann formen."}, {"heading": "Sitzkommando durchsetzen \u2013 Schema", "tag": "Schema", "numbered": [{"title": "Fehler", "text": "\u201eSitz!\u201c \u2192 Hund reagiert nicht = strafen (in den Nacken greifen, falls n\u00f6tig \u00fcber das Halsband an die Stelle zur\u00fcckf\u00fchren, energisch in Position formen) & danach aufl\u00f6sen."}, {"title": "1. Wiederholung", "text": "\u201eSitz!\u201c \u2192 reagiert sofort = (partiell) belohnen & aufl\u00f6sen; reagiert nicht = nochmal strafen (gesteigerte Intensit\u00e4t) und erneut in die erste Wiederholung."}, {"title": "2.\u20138. Wiederholung", "text": "Reagiert sofort = (partiell) belohnen & aufl\u00f6sen. Bei erneutem Fehler geht der Wiederholungscounter zur\u00fcck auf null."}, {"title": "Nachhaltigkeitscheck", "text": "Gesamten Aufbau nach kurzer Pause oder sp\u00e4ter anderswo in \u00e4hnlicher Schwierigkeit wiederholen. Endergebnis: reagiert sofort = (partiell) belohnen & aufl\u00f6sen."}], "difficultyList": ["Handvoll Leckerchen vor den Hund werfen", "Ball prellen bzw. Spielzeug werfen", "Locken durch eine andere Person", "Arme ruckartig bewegen (inkl. \u201eHallo!\u201c) oder mit der Leine hantieren", "Einen Schritt zur Seite/vor/zur\u00fcck oder Leine ablegen und sich einige Meter entfernen", "Umgebung mit hoher Reizlage (Radweg, Spielplatz, Wald bei D\u00e4mmerung\u2026)"]}]}, {"id": "leine", "num": "03", "short": "Orientierung an der Leine", "title": "Orientierung an der Leine", "subtitle": "Startritual, Leinenf\u00fchrigkeit & Freizeitmodus", "bg": "ch-leine", "sections": [{"heading": "Startritual", "tag": "Anleitung", "content": "Vor der Orientierung wird der Hund durch das Startritual in eine andere Grundstimmung versetzt \u2013 Aufregung wird reduziert. So l\u00e4sst sich Leinenf\u00fchrigkeit leichter einfordern und der Hund macht weniger Fehler. Es geht erst in die Bewegung, wenn das Startritual fehlerfrei klappt.", "numbered": [{"title": "Hund ranholen", "text": "Am besten nonverbal \u2013 \u00fcber Handgeste oder Leine. \u201eWeniger reden, mehr handeln!\u201c"}, {"title": "Ausrichten", "text": "Hund auf festgelegte Seite stellen und gerade ausrichten (stabiles Stehen). Bei Fehler \u2192 Startritual von vorne."}, {"title": "Innehalten", "text": "Aufrichten und einen Moment innehalten."}, {"title": "Leine formen", "text": "Wenn der Hund orientiert neben dem Bein steht: Leine ans Halsband auf k\u00fcrzeste Stufe schnallen, sortieren, zu gleichm\u00e4\u00dfigem \u201eU\u201c formen. Bei Fehler \u2192 Startritual von vorne."}, {"title": "Innehalten", "text": "Nochmal aufrichten und einen Moment innehalten."}, {"title": "Signalwort", "text": "Signalwort sprechen (z.B. \u201eLeine!\u201c, \u201eRan!\u201c oder \u201eBei mir!\u201c)."}, {"title": "Loslaufen", "text": "Weiter innehalten oder loslaufen \u2013 je nach Trainingsstand / \u00dcbungsziel."}]}, {"heading": "Aufl\u00f6sen", "tag": "Anleitung", "numbered": [{"title": "Kontakt", "text": "Mit dem Hund in Kontakt gehen (Ber\u00fchrung an der Schulter), ggf. nochmal gerade ausrichten."}, {"title": "Innehalten", "text": "Aufrichten und einen Moment innehalten."}, {"title": "Leine l\u00f6sen", "text": "Leine l\u00e4nger schnallen."}, {"title": "Innehalten", "text": "Nochmal aufrichten und einen Moment innehalten."}, {"title": "Aufl\u00f6sesignal", "text": "Aufl\u00f6sesignal (z.B. \u201eOk!\u201c oder \u201eFertig!\u201c) bzw. k\u00f6rpersprachliche Freigabe (Handgeste)."}, {"title": "Belohnen", "text": "Nach gelungener Einheit ggf. ausgiebig belohnen (variabel: Stimme, Futter, Freilauf, Streicheleinheit)."}]}, {"heading": "Warum ein Ritual?", "tag": "Prinzip", "content": "Je st\u00e4rker sich der Orientierungsmodus vom Alltags- bzw. Freizeitmodus abgrenzt, desto besser kann der Hund das gew\u00fcnschte Verhalten abrufen. Das Ritual hilft auch dem Menschen, sich zu sortieren und gemeinsam mit dem Hund in die Konzentration zu finden. Ein unsauber ausgef\u00fchrtes Startritual zeigt sich in der gesamten folgenden Einheit. Orientierung am Menschen beginnt bereits in der Statik \u2013 den Blick schon w\u00e4hrend des Rituals immer wieder nach vorne richten, vom Hund abwenden, abgrenzen.\n\nGrundtempo erst nach etwas \u00dcbung erh\u00f6hen, anfangs Schritt f\u00fcr Schritt. Je langsamer man sich bewegt, desto mehr Zeit bleibt, auf unerw\u00fcnschtes Verhalten zu reagieren."}, {"heading": "Belohnen", "tag": "Hinweis", "content": "Blickkontakt, L\u00e4cheln, Ausstreichen und verbales Lob reichen meist und pushen den Hund nicht zu stark. Loben, wenn der Hund Blickkontakt sucht, sofort stehen bleibt oder in sauberen Wendungen. Bei besonders guter Ausf\u00fchrung auch mal ein Leckerchen \u2013 aber dosiert. Da wir uns im sozialen Lernen befinden, wird eher \u00fcber soziale Verst\u00e4rker gearbeitet. Anfangs mit jeglicher Belohnung sparsam umgehen, um dem Hund das Halten einer angemessenen Stimmung zu erleichtern."}, {"heading": "Strafe & Wiederholung \u2013 Beispiel Stehenbleiben", "tag": "Schema", "numbered": [{"title": "Fehler", "text": "Mensch bleibt stehen, Hund l\u00e4uft einfach weiter."}, {"title": "Strafen", "text": "Mensch straft das Verhalten (z.B. Leinenruck, Griff ins Fell oder \u201eEy!\u201c)."}, {"title": "Wiegeschrittwendung", "text": "Mensch dreht nach hinten ab, l\u00e4uft wenige Schritte zur\u00fcck, dann wieder eine Wendung, steuert erneut auf den Fehlerpunkt zu und bleibt dort stehen."}, {"title": "\u00dcberpr\u00fcfen", "text": "Mind. 1\u00d7, besser 2\u20138\u00d7 pr\u00fcfen: Hat der Hund verstanden, wof\u00fcr er gestraft wurde? War die Intensit\u00e4t ausreichend? Hemmt er sich nachhaltig? Zeigt er Akzeptanz? Dabei bekommt der Hund auch die M\u00f6glichkeit, selbstwirksam zu sein."}], "content": "Idealer Aufbau: nicht mehr als drei, vier Strafen n\u00f6tig \u2013 je weniger, desto besser. Um Gew\u00f6hnung bzw. Korrekturspirale zu vermeiden, muss die Strafintensit\u00e4t die Erregung des Hundes \u00fcbertreffen. Deshalb anfangs nur \u00fcben, wenn der Hund nicht zu aufgeregt ist. Nach der ersten Korrektur darf er ruhig beeindruckt und in st\u00e4rkerer Hemmung sein \u2013 das Verhalten soll sich deutlich \u00e4ndern, der Hund angemessen in die Demut gehen.\n\nSeitenwechsel oder Tr\u00f6deln werden in niedriger Intensit\u00e4t \u00fcber Beharrlichkeit gestraft (Zuppeln, ins Halsband greifen, kurz r\u00fcberholen) \u2013 diese Fehler aber nicht wiederholen, sonst dreht man sich im Kreis. Einzige Ausnahme: das gemeinsame Loslaufen direkt nach dem Startritual, wenn es beim ersten Mal nicht fl\u00fcssig war."}, {"heading": "Freizeitmodus", "tag": "Hinweis", "content": "Im Freizeitmodus keine Strafen (au\u00dfer es ist unvermeidbar, eine Ansage zu machen), um den Hund nicht abzustumpfen. Ziehen an der Leine ist erlaubt und Teil des Managements. Zeigt der Hund aus eigener Motivation Orientierung, darf das (partiell) verst\u00e4rkt werden.\n\nBis zur n\u00e4chsten Stunde Fokus auf Stehenbleiben, Wendungen und Ablenkungen \u2013 nat\u00fcrliche (Bl\u00e4tter, St\u00f6ckchen, Grasb\u00fcschel) wie k\u00fcnstlich initiierte (Spielzeug, Leckerchen am Boden). Auch im Wohnzimmer, Garten oder vor der Haust\u00fcr trainierbar. Je sauberer und kleinschrittiger in ablenkungsarmer Umgebung, desto leichter sp\u00e4ter in h\u00f6herer Reizlage. In der Statik weiter \u00fcben (stabiles Stehen).", "quote": "\u00dcbungsstrecken noch nicht \u00fcberm\u00e4\u00dfig erh\u00f6hen \u2013 bei 10\u201320 m bleiben!", "quoteLabel": "L\u00e4nge der \u00dcbungsstrecken"}]}, {"id": "distanz", "num": "04", "short": "Orientierung auf Distanz", "title": "Orientierung auf Distanz", "subtitle": "Weg & Radius halten mit der Schleppleine", "bg": "ch-distanz", "sections": [{"heading": "Aufbau", "tag": "\u00dcbersicht", "content": "Startritual: Ranangeln \u00fcber die Leine + Hund im Nahbereich ausrichten + Signalwort (z.B. \u201eWeg!\u201c).\nSchlussritual: Ansprache + k\u00f6rpersprachliche Einladung in den Nahbereich + Freigabe.\n\nWichtig: Es wird nicht \u00fcber die Schleppleine eingewirkt! Sie dient nur als visuelle Hilfe f\u00fcr den Menschen, um Abst\u00e4nde einzusch\u00e4tzen. Langfristig soll der Hund die Orientierung auf Distanz auch ohne Schleppleine halten \u2013 deshalb wird sie innerhalb des Rituals (au\u00dfer in Notf\u00e4llen) nicht als Hilfsmittel genutzt."}, {"heading": "Was gestraft wird", "tag": "Schema", "numbered": [{"title": "Weg verlassen", "text": "Sobald eine Pfote den Rasenstreifen (oder die Waldb\u00f6schung etc.) betritt. Auf Feldwegen darf der Hund die Grasb\u00fcschel in der Mitte ber\u00fchren \u2013 es gelten die Grenzen links und rechts neben den Spurrillen. Markieren auf dem Weg wird nicht geahndet. (Am Strand / auf gro\u00dfen Wiesen gilt nur der Radius.)"}, {"title": "Radius verlassen", "text": "Sobald die 5-m-Schleppe nicht mehr richtig schleift und kurz davor ist, vom Boden abzuheben \u2013 in alle Himmelsrichtungen, auch beim Tr\u00f6deln nach hinten. Hemmt sich der Hund zu stark, verbal motivieren."}, {"title": "Nicht reagieren auf die Ansprache", "text": "In Verbindung mit der k\u00f6rpersprachlichen Einladung. Je nach Situation lohnt sich die Wiederholung (siehe Stellvertreterkonflikte)."}, {"title": "Jagdverhalten", "text": "Ab dem F\u00e4hrte laufen. Kurzes Wittern und Vorstehen sind okay."}, {"title": "Fressen vom Boden", "text": "Fressen bzw. ins Maul nehmen von Dingen, die auf dem Boden liegen."}, {"title": "Fixieren / P\u00f6beln", "text": "Unabh\u00e4ngig davon, um welchen Reiz es sich handelt."}, {"title": "Kontaktaufnahme", "text": "Mit fremden Menschen oder Artgenossen, die nicht zur Gruppe geh\u00f6ren (auch bekannten). Der Hund kann situativ freigegeben werden."}]}, {"heading": "Strafe & Wiederholung", "tag": "Prinzip", "content": "Auf Distanz: alle Fehler mit einem Leinenwurf plus kr\u00e4ftigem \u201eEy!\u201c. Auf N\u00e4he: mit K\u00f6rpersprache oder H\u00e4nden arbeiten.\n\nNach einem Leinenwurf den Hund neutral zu sich einladen und gemeinsam die geworfene Leine holen. Er darf den Nahbereich nach der Einladung nicht mehr ohne Erlaubnis verlassen (durchsetzen z.B. \u00fcber Griff in den Nacken). Eine Einladung bedeutet immer: \u201eBleib bei mir, bis ich dir etwas anderes sage\u201c \u2013 so entsteht nebenbei eine verbindliche Freifolge. Ein Kommando daf\u00fcr ist m\u00f6glich, aber nicht n\u00f6tig. Alternativ managen (am Halsband f\u00fchren bzw. Schleppleine kurz nehmen).\n\nNach dem Holen der Leine nochmal sauber aufstellen, das Kommando f\u00fcr die Distanz erneut sprechen (in die Wiederholung gehen, nur ohne abzudrehen) und mindestens einen Streckenabschnitt fehlerfrei absolvieren.", "quote": "Nach einer Strafe darauf achten, dass der Hund nicht zu dynamisch wird oder sich sofort enthemmt \u2013 k\u00f6rpersprachlich nachsetzen oder im Nahbereich die Stimmung nachhaltig runterregulieren.", "quoteLabel": "Wichtige Erg\u00e4nzung"}, {"heading": "Verst\u00e4rken & Freizeitmodus", "tag": "Hinweis", "content": "R\u00fcckorientiert sich der Hund automatisch, sucht Blickkontakt, bleibt stehen, um den Radius nicht auszureizen \u2013 das darf hin und wieder verst\u00e4rkt werden (gern auch mit Keksen), ebenso im Freizeitmodus. Sch\u00f6n, wenn der Hund ohne Ritual, also intrinsisch motiviert, Orientierung zeigt.\n\nIm Freizeitmodus darf der Hund an der Schleppleine ziehen, an die Wegr\u00e4nder gehen und muss sich nicht r\u00fcckorientieren \u2013 nach der Freigabe wird das nicht gestraft."}]}, {"id": "begegnungen", "num": "05", "short": "Hundebegegnungen", "title": "Hundebegegnungen", "subtitle": "P\u00f6belfrei aneinander vorbei \u2013 die K\u00f6nigsdisziplin", "bg": "ch-begegnungen", "sections": [{"heading": "Erst auf Distanz", "tag": "Prinzip", "content": "Hundebegegnungen zun\u00e4chst nur auf Distanz \u00fcben und sich anderen Hunden langsam ann\u00e4hern (z.B. bis auf 20 m). Rechtzeitig aufl\u00f6sen und ins Management wechseln \u2013 es ist noch nicht das Ziel, im Orientierungsmodus direkt vorbeizulaufen. An anderen Hunden erst vorbei, wenn der eigene Hund es auf Distanz schafft, die Klappe zu halten, ohne dass man (noch oft) korrigieren muss."}, {"heading": "Schwierigkeit staffeln", "tag": "Hinweis", "content": "F\u00fcr die ersten Versuche Artgenossen w\u00e4hlen, die sich f\u00fcr den eigenen Hund kaum interessieren. Erst sp\u00e4ter in Begegnungen gehen, in denen man angep\u00f6belt wird \u2013 das ist die K\u00f6nigsdisziplin. Auch \u00fcber das Gel\u00e4nde l\u00e4sst sich steuern: breite, gut \u00fcberblickbare Wege sind schmalen, verwinkelten anfangs vorzuziehen. Bei territorial motivierten Hunden Begegnungen zun\u00e4chst abseits der eigenen Hood \u00fcben.", "quote": "Im Management ist P\u00f6beln erlaubt! Sobald du deinen Hund aus dem Orientierungsmodus aufgel\u00f6st hast, darf er sich aufregen. Du machst dir dadurch nichts kaputt \u2013 ganz im Gegenteil.", "quoteLabel": "Wichtig"}, {"heading": "Den Gedanken strafen, nicht erst das P\u00f6beln", "tag": "Prinzip", "content": "Nicht erst das P\u00f6beln strafen, sondern schon den Gedanken daran. Viele Hunde verlieren sich gedanklich, sobald sie einen Artgenossen erblicken. \u00dcber Stehenbleiben, Wendungen oder Tempowechsel schon vor der Begegnung pr\u00fcfen, ob der Hund noch aufmerksam ist \u2013 \u201eeinarbeiten\u201c. Man geht also bereits intensiv mit dem Hund ins Gespr\u00e4ch, bevor der andere nur noch wenige Meter entfernt ist. Sobald der Hund verinnerlicht hat, dass P\u00f6beln im Orientierungsmodus verboten ist, und entspannt vorbeil\u00e4uft, kann das Einarbeiten nach und nach abgebaut werden \u2013 langfristig mehr Nat\u00fcrlichkeit."}, {"heading": "Korrekturspirale vermeiden", "tag": "Wichtig", "content": "Bei l\u00e4ngeren Strecken im Orientierungsmodus nicht in eine Korrekturspirale rutschen. Die Sensibilit\u00e4t auf Strafe muss erhalten bleiben \u2013 Strafen nicht inflation\u00e4r einsetzen (Gew\u00f6hnung).\n\nPro Trainingseinheit (Startritual bis Schlussritual) sollten nicht mehr als vier gr\u00f6\u00dfere Konflikte aufkommen. War eine Sequenz sehr konfliktbehaftet, als Abschluss eine kleinere Einheit w\u00e4hlen, in der bestenfalls kein einziger Konflikt passiert."}]}, {"id": "alltag", "num": "06", "short": "Alltagsleinenf\u00fchrigkeit", "title": "Alltagsleinenf\u00fchrigkeit", "subtitle": "Der mittlere Modus der 3-fach-Leine", "bg": "ch-alltag", "sections": [{"heading": "Die drei Modi", "tag": "\u00dcbersicht", "content": "\u00dcber die L\u00e4nge der 3-fach verstellbaren Leine wei\u00df der Hund, in welchem Modus er ist: ganz lang = Freizeit, mittel = Alltagsleinenf\u00fchrigkeit, k\u00fcrzeste Stufe = Orientierungsmodus.\n\nAnders als im Orientierungsmodus gibt es in der Alltagsleinenf\u00fchrigkeit kein Start- und Schlussritual. Der Hund wird aus der Freizeit nur in den Nahbereich geholt, damit er mitbekommt, dass in den Alltagsmodus geschnallt wird. Ein verbales Kommando ist \u00fcberfl\u00fcssig (kann bei Bedarf eingef\u00fchrt werden). Akkurates Wiederholen nach Strafen ist hier nicht mehr n\u00f6tig \u2013 durch die pingelige Vorarbeit sollte der Hund bereits Akzeptanz f\u00fcr Strafen haben. Nach einem gr\u00f6\u00dferen Fehler schadet eine gelegentliche \u00dcberpr\u00fcfung dennoch nicht."}, {"heading": "Was verboten ist", "tag": "Schema", "numbered": [{"title": "Seitenwechsel", "text": "Vom Hund ausgehend. Der Mensch kann Seitenwechsel selbst einleiten \u2013 dann den Hund immer vorne herum f\u00fchren (hinten hat man keine Augen)."}, {"title": "Vor die F\u00fc\u00dfe laufen", "text": "Beim Stehenbleiben nicht in den Laufweg."}, {"title": "Leine ausreizen", "text": "Gilt auch f\u00fcr Wendungen."}, {"title": "Gesch\u00e4fte verrichten", "text": "Ohne Freigabe."}, {"title": "Kontaktaufnahme", "text": "Mit anderen Menschen oder Artgenossen."}]}, {"heading": "Was erlaubt ist", "tag": "Prinzip", "content": "Der Hund muss nicht zeitgleich anhalten und darf ein, zwei Schrittchen weitergehen. Er muss sich nicht parallel zum Bein ausrichten, darf schr\u00e4g stehen \u2013 soll nur den Laufweg nicht versperren. Bei l\u00e4ngerem Stehen darf er sich auf der festgelegten Seite im Nahbereich hinsetzen, ablegen oder schn\u00fcffeln \u2013 er soll nur mitbekommen, wenn es weitergeht, und die Leine nicht auf Spannung bringen.\n\nDie Leine h\u00e4ngt immer locker durch (wie eine M\u00fcslischale, kein perfektes U n\u00f6tig) \u2013 au\u00dfer bei Freigabe f\u00fcr ein Gesch\u00e4ft."}, {"heading": "Freigaben: Gesch\u00e4fte & Begr\u00fc\u00dfung", "tag": "Hinweis", "content": "Freigabe erfolgt \u00fcber das klassische Aufl\u00f6sesignal oder eine Handgeste. W\u00e4hrend der Freigabe darf Spannung auf der Leine sein. Manche Hunde brauchen kurz, um den Platz zu finden. Danach spricht der Mensch den Hund mit Namen an und l\u00e4dt ihn per Handgeste zur\u00fcck in den Nahbereich \u2013 ab dann kein Ziehen und keine Gesch\u00e4fte mehr. F\u00fcr kurze Freigaben muss die Leinenl\u00e4nge nicht ge\u00e4ndert werden; f\u00fcr l\u00e4ngere Schn\u00fcffelpausen besser in den Freizeitmodus umleinen.\n\nBegr\u00fc\u00dfungssituationen werden genauso gehandhabt: Der Hund verl\u00e4sst den Nahbereich erst nach Freigabe und h\u00e4lt ihn wieder ein, sobald er nach der Kontaktaufnahme zur\u00fcckgeholt wurde."}, {"heading": "Voraussetzungen & Grenzen", "tag": "Wichtig", "content": "Ist der Alltagsmodus etabliert, kann der Spaziergang komplett darin ablaufen \u2013 Umschnallen entf\u00e4llt, sofern man bereit ist, dauerhaft konsequent und handlungsf\u00e4hig aufzutreten. Kann oder will man das gerade nicht (stressiger Tag, direkt nach dem Aussteigen), lieber im Freizeitmodus managen, statt sich unverbindlich zu verhalten. Gleiches gilt f\u00fcr Situationen, die der Hund noch nicht leisten kann \u2013 diese erst im Orientierungsmodus besprechen und festigen.\n\nDer Hund sollte im Orientierungsmodus ca. 30 Min ohne eine einzige Strafe in moderater bis leicht erh\u00f6hter Reizlage mitlaufen k\u00f6nnen, bevor auf Alltagsmodus umgestellt wird. Sind mehr als 4 Strafen auf einem einst\u00fcndigen Spaziergang n\u00f6tig, einen Schritt zur\u00fcckgehen.", "quote": "Passt auf, dass ihr nicht in die Ermahnungsfalle tappt \u2013 sonst macht ihr euch die Alltagsleinenf\u00fchrigkeit ganz schnell wieder kaputt.", "quoteLabel": "H\u00e4ufigster Fehler"}]}, {"id": "rueckorientierung", "num": "07", "short": "Automatische R\u00fcckorientierung", "title": "Automatische R\u00fcckorientierung", "subtitle": "Der Hund \u00fcbernimmt Verantwortung bei Reizen", "bg": "ch-rueckorientierung", "sections": [{"heading": "Prinzip", "tag": "Prinzip", "content": "Die Verantwortung liegt beim Hund, bei entgegenkommenden Reizen R\u00fccksprache zu halten: rechtzeitig Tempo verringern oder anhalten, Blickkontakt nach hinten suchen und sich eigenst\u00e4ndig im Nahbereich einfinden. Den Nahbereich verl\u00e4sst er erst nach expliziter Freigabe wieder.\n\nBest\u00e4tigt wird das Zur\u00fcckschauen mit einem vorher angelernten Markerwort (z.B. \u201eTop!\u201c) \u2013 ein Sekund\u00e4rverst\u00e4rker, der eine hochwertige Futterbelohnung ank\u00fcndigt. Das Markerwort l\u00f6st NICHT den Blick nach hinten aus, sondern best\u00e4tigt ihn."}, {"heading": "Verst\u00e4rkung ausschleichen", "tag": "Hinweis", "content": "In den ersten 2\u20134 Wochen kontinuierlich verst\u00e4rken (jede erfolgreiche R\u00fcckorientierung wird belohnt). Danach partiell: nur noch etwa jedes 2. oder 3. Mal, das Intervall wird immer weiter gestreckt, die Wertigkeit darf sinken. Sobald generalisiert gezeigt (nach ca. 3\u20136 Monaten), k\u00f6nnen Markerwort und Futter entfallen \u2013 das Verhalten wird zur Selbstverst\u00e4ndlichkeit.\n\nH\u00e4lt der Hund an und beobachtet einen Reiz, darf das mit ruhiger Stimme gelobt werden. Das Markerwort erst sprechen, wenn er sich selbstst\u00e4ndig r\u00fcckorientiert und den Menschen anschaut. Auch Zur\u00fccklaufen und Einkehren im Nahbereich d\u00fcrfen verbal gelobt werden \u2013 freundlicher Empfang, wenn er sich eigenst\u00e4ndig abgewendet hat."}, {"heading": "Beispiel: Kr\u00e4he am Feldrand (20 m)", "tag": "Beispiel", "numbered": [{"title": "Verlangsamen & Beobachten", "text": "Der Hund wird langsamer, kommt zum Stehen, beobachtet die Kr\u00e4he, geht aber keinen Schritt auf sie zu. Der Mensch lobt ggf. mit ruhiger Stimme die Statik."}, {"title": "Abwenden & Marker", "text": "Nach kurzem Innehalten wendet sich der Hund ab und nimmt Blickkontakt auf. In diesem Moment ert\u00f6nt das Markerwort (\u201eTop!\u201c), der Hund macht sich auf den Weg in den Nahbereich. W\u00e4hrend er zur\u00fcckl\u00e4uft, lobt der Mensch verbal."}, {"title": "Belohnung & Freifolge", "text": "Im Nahbereich erh\u00e4lt der Hund seine Futterbelohnung (oder nicht, je nach Verst\u00e4rkungsphase) und wird auf die vom Reiz abgewandte Seite eingeladen, um in Freifolge vorbeizulaufen. Alternativ managen (Griff ins Halsband bzw. Schleppleine kurz)."}, {"title": "Aufl\u00f6sen", "text": "Freifolge bzw. Management aufl\u00f6sen, sobald Mensch und Hund den Reiz passiert haben."}]}, {"heading": "Fehler & Strafen", "tag": "Schema", "numbered": [{"title": "Kein Verlangsamen", "text": "Der Hund wird nicht langsamer und geht interessiert auf den Reiz zu oder startet durch \u2192 Leinenwurf + verbaler Abbruch (\u201eEy!\u201c)."}, {"title": "Kein Reagieren auf Marker", "text": "Der Hund wendet sich zwar ab, l\u00e4uft auf das Markerwort aber nicht bzw. nur z\u00f6gerlich und bleibt gedanklich beim Reiz \u2192 Leinenwurf + verbaler Abbruch."}, {"title": "Nahbereich ohne Freigabe verlassen", "text": "Z.B. direkt nach dem Futter oder beim Passieren \u2192 Griff ins Fell, k\u00f6rpersprachliche Korrektur (Aufstampfen und/oder auf den Oberschenkel hauen), verbaler Abbruch oder Leinenwurf (je nach Distanz)."}], "content": "Die R\u00fcckorientierung sollte sp\u00e4testens bei ca. 20 m Reizabstand gezeigt werden. Bei Fahrr\u00e4dern oder E-Rollern eher 30 m, da schneller. Alternativ als Management: rechtzeitige Ansprache mit k\u00f6rpersprachlicher Einladung oder R\u00fcckruf, solange der Reiz noch weit weg ist. Reize von hinten sind Aufgabe des Menschen \u2013 hier immer Ansprache mit Einladung in den Nahbereich."}]}, {"id": "warte-stopp", "num": "08", "short": "Warte & Not-Stopp", "title": "Warte & Not-Stopp", "subtitle": "Neutrales Halten & die Lebensversicherung", "bg": "ch-warte-stopp", "sections": [{"heading": "Einsatzbereiche", "tag": "\u00dcbersicht", "content": "\u201eWarte!\u201c wird genutzt, wenn der Hund an einem Ort verweilen soll \u2013 egal ob nah oder fern, ob sitzend, liegend oder stehend. Wichtig: Der Hund zeigt gerade kein unerw\u00fcnschtes Verhalten, denn \u201eWarte!\u201c ist ein v\u00f6llig neutrales Signal. N\u00fctzlich z.B., wenn im Freilauf ein Radfahrer angeprescht kommt oder wenn man nochmal zur\u00fcck in die Wohnung muss.\n\n\u201eSTOPP!\u201c kombiniert Formalismus und Strafe: Der Hund h\u00e4lt sofort an und geht zus\u00e4tzlich in eine starke Hemmung. Das Not-Stopp ist f\u00fcr Notsituationen, in denen jeglicher Zugriff fehlt (Hase, Panik nach Stromzaun, Erzfeind am Ackerende) \u2013 wenn Abbruch und R\u00fcckruf nichts bewirken.", "quote": "Das Not-Stopp gilt als Lebensversicherung und sollte sparsam verwendet werden, damit es sich nicht abnutzt!", "quoteLabel": "Grundregel"}, {"heading": "Trainingslogik", "tag": "Prinzip", "content": "Bei beiden Kommandos ist ein statischer Hund das Endergebnis \u2013 er sieht nur anders aus: bei \u201eWarte!\u201c neutral bis freudig, bei \u201eStopp!\u201c stark gehemmt und deutlich passiv-dem\u00fctig.\n\nKlappt ein Trainingsschritt bei \u201eWarte!\u201c \u00fcber zwei bis drei Einheiten mehrfach fehlerfrei, folgt der n\u00e4chste. Keine lineare Entwicklung erwarten \u2013 immer wieder einen Schritt zur\u00fcck zum Festigen. Das \u201eWarte!\u201c ist die Grundlage f\u00fcrs \u201eStopp!\u201c: Da Letzteres seltener ge\u00fcbt werden kann, hilft es, wenn der Hund die \u00dcbungen schon kennt. Ab Trainingsschritt 6 des \u201eWarte!\u201c beginnt die Durchsetzungsphase (Strafe \u00fcber Intensit\u00e4t, weniger Futter). Wiederholungen nach Fehlern sind in beiden Phasen wichtig."}, {"heading": "Aufl\u00f6sen & Belohnen", "tag": "Hinweis", "content": "Aufl\u00f6sen: Mensch stellt sich neben den Hund, spricht das Aufl\u00f6sesignal (ggf. mit Handgeste) und geht ERST DANACH in die Bewegung. Fallen Bewegung und Freigabe zusammen, l\u00f6st sich der Hund sp\u00e4ter selbstst\u00e4ndig auf den ersten Schritt auf. Hunde priorisieren Gesten/Ber\u00fchrungen vor akustischen Reizen. Freigabe auf Distanz generell vermeiden.\n\nBelohnen: Der Hund soll beim F\u00fcttern die Statik halten. Verl\u00e4sst er die Position, wird gestraft (anfangs \u00fcber Beharrlichkeit, sp\u00e4ter Intensit\u00e4t). Anfangs das Futter erst holen, wenn man direkt neben dem Hund steht. Gro\u00dfz\u00fcgig belohnen, aber nicht immer am Ende \u2013 sonst verkn\u00fcpft der Hund den Keks mit der Aufl\u00f6sung. Belohnung und Aufl\u00f6sung sind zwei verschiedene Dinge."}, {"heading": "Trainingsschritte \u201eWarte!\u201c", "tag": "Schema", "numbered": [{"title": "Schritt 1 \u2013 Aus dem Laufen anhalten", "text": "Hund neben dem Menschen (ggf. \u00fcber Schnalzen/Leine locken). Aus dem Laufen mit freundlicher Stimme \u201eWarte!\u201c sagen und unmittelbar danach anhalten. L\u00e4uft der Hund weiter, sanft an der Brust bremsen und liebevoll in Position formen. Immer erst das Signal, dann anhalten. Sobald er ohne Hilfe zuverl\u00e4ssig anh\u00e4lt \u2192 Statik mit Futter belohnen."}, {"title": "Schritt 2 \u2013 Wiegeschritte", "text": "Nach dem \u201eWarte!\u201c pendelt der Mensch \u2013 erst links/rechts, dann vor/zur\u00fcck (Zweites ist schwerer)."}, {"title": "Schritt 3 \u2013 Weggehen & zur\u00fcck", "text": "Mehrfach wenige Schritte weg und wieder hin, in alle Richtungen, auch umrunden. Hund nicht direkt anschauen, aufrecht bleiben \u2013 Blickkontakt oder frontales Zugehen kann als Einladung bzw. Weichen missverstanden werden. Zus\u00e4tzlich an der Schleppleine \u00fcben, nicht nur an der kurzen Leine."}, {"title": "Schritt 4 \u2013 Weiterlaufen", "text": "Statt anzuhalten l\u00e4uft der Mensch ein, zwei Schritte weiter (sp\u00e4ter mehr) und beobachtet peripher. Folgt der Hund, wird gestraft (Beharrlichkeit \u2192 sp\u00e4ter Intensit\u00e4t). Gerade nach vorne ausgerichtet bleiben, Oberk\u00f6rper nicht eindrehen."}, {"title": "Schritt 5 \u2013 Tempo erh\u00f6hen", "text": "Nicht an Schritt 4 ankn\u00fcpfen, sondern Schritt 1 in h\u00f6herem Tempo. Erst wenn das joggend klappt, die weiteren Schritte."}, {"title": "Schritt 6 \u2013 Distanz", "text": "\u201eWarte!\u201c auch, wenn der Hund einige Meter vor oder hinter dem Menschen ist. Am besten mit hinten laufendem Hund starten \u2013 man kann sich umdrehen und ggf. direkt korrigieren."}, {"title": "Schritt 7 \u2013 Ablenkung", "text": "Kommando, w\u00e4hrend der Hund im gr\u00f6\u00dferen Radius etwas Spannendes tut (Pippistelle, Zergeln). Auch selbst zum Affen machen \u2013 mit Spielzeug/Futter locken, herumh\u00fcpfen. Klappt das, im Alltag bei kritischen Begegnungen nutzbar."}, {"title": "Schritt 8 \u2013 Zoomies / Spiel", "text": "Kommando w\u00e4hrend Zoomies oder dynamischem Spiel mit Artgenossen. Nicht mit jedem Hund ohne Weiteres erreichbar!"}]}, {"heading": "\u201eStopp!\u201c \u2013 Schritt 1", "tag": "Schema", "content": "Hund neben dem Menschen. V\u00f6llig unerwartet und ohne dass der Hund etwas falsch macht, br\u00fcllt der Mensch aus dem Laufen aus tiefster Seele \u201eStopp!\u201c und stampft unmittelbar mit voller Wucht schr\u00e4g vor dem Hund auf (versperrt den Laufweg). Zus\u00e4tzlich Arm kraftvoll ausstrecken, Hand als optische Barriere vor Brust/Kopf. Der Hund soll versteinern.\n\nDanach Futter anbieten \u2013 aber nur, wenn er die starke Hemmung h\u00e4lt (die soll verst\u00e4rkt werden). Lockert er die Stimmung, erneut kr\u00e4ftig in den Kragen greifen und Futter wegstecken, dann neuer Versuch. Verweigert er das Futter vor Schreck, einfach wegstecken. L\u00e4uft er trotz Intensit\u00e4t weiter, energisch in den Kragen greifen und unsanft in Position bringen, ggf. beherzt ins Sitz formen. Die Hilfestellung (Aufstampfen, Hand) nur in den ersten zwei bis drei Einheiten, dann schnellstm\u00f6glich abbauen.\n\nAlle weiteren Schritte sind identisch zum \u201eWarte!\u201c \u2013 nur wird das Not-Stopp immer als Urschrei performt, mit maximal Wumms in der Stimme.", "quote": "Max. 5 Wiederholungen pro Einheit (sp\u00e4ter 2\u20133), danach auflockern \u2013 aber nicht sofort. Zwischen den Einheiten 2\u20133 Tage Pause. Nach der Anlernphase (2\u20134 Wochen) nur noch alle 3\u20138 Wochen \u00fcben.", "quoteLabel": "Dosierung Not-Stopp"}, {"heading": "Ernstfall: Vorgehen nach dem Not-Stopp", "tag": "Wichtig", "content": "Stoppt der Hund und h\u00e4lt an: ruhig, aber bestimmt n\u00e4hern, sofort anleinen und wortlos zur\u00fcck zum Auto bzw. nach Hause f\u00fchren \u2013 Leine kurz und auf Spannung, aber ohne W\u00fcrgen. Der Mensch grenzt sich vollst\u00e4ndig ab und w\u00fcrdigt den Hund f\u00fcr Stunden (ggf. bis zum n\u00e4chsten Tag) keines Blickes. Ein-/Aussteigen kontrolliert der Mensch komplett (der Hund \u201ewird eingestiegen\u201c).\n\nIn der Wohnung wird der Hund an einem Platz angeleint, den er freiwillig nicht aufsuchen w\u00fcrde (Diele, G\u00e4ste-WC, Keller). Wasser und Decke stehen bereit. Dort bleibt er mehrere Stunden, m\u00f6glichst ungest\u00f6rt. Idee: dem Hund spiegeln, wie es sich anf\u00fchlt, im Stich gelassen zu werden \u2013 sozialer Ausschluss als Baustein. Futter gibt es normal, aber kommentarlos (nach 10 Min wegstellen, wenn nicht gefressen). Bellt er aus Frust, folgt nach dem ersten Beller eine Strafe in sehr hoher Intensit\u00e4t (z.B. leere PET-Flasche o.\u00e4. mit \u201eEEEYYY!\u201c davor pfeffern).\n\nNach ein paar Stunden (oder am n\u00e4chsten Tag) neutral ableinen, ohne gro\u00dfe Vers\u00f6hnung. Danach einige Tage bewusst st\u00e4rker abgrenzen, Stellvertreterkonflikte und Orientierung in den Fokus, Privilegien zur\u00fckarbeiten lassen.\n\nStoppt der Hund nicht, kommt aber zur\u00fcck: am Schlawittchen packen, bis an den Punkt zur\u00fckbringen, wo er h\u00e4tte anhalten sollen, dort \u00fcber sehr intensive taktile Strafe festplomben, dann die weiteren Schritte. L\u00e4uft er trotz Signal weiter: bei R\u00fcckkehr neutral empfangen, sofort an die ganz kurze Leine, dann wie beschrieben verfahren.\n\nAusnahme: Ist der Hund aus Panik (z.B. Stromzaun) abgehauen, wird er nur neutral eingesammelt und ggf. im Nahbereich co-reguliert \u2013 kein sozialer Ausschluss.", "quoteLabel": null}, {"heading": "Emotionale Belastung", "tag": "Hinweis", "content": "Der Ernstfall ist f\u00fcr die meisten Halter*innen emotional belastend \u2013 sowohl das Abhauen als auch die ritualisierten Schritte danach. So stark in die Abgrenzung zu gehen ist ungewohnt und kostet Ressourcen. Steht man nicht wirklich dahinter, sozialen Ausschluss zu nutzen, zeigen die Ma\u00dfnahmen wenig Wirkung. In solchen F\u00e4llen Unterst\u00fctzung bei der Trainerin holen \u2013 ein solches Erlebnis muss nicht allein bew\u00e4ltigt werden."}]}];

          return h('button',{key:ch.id,onClick:function(){props.onSelect(i);props.onClose();},style:{width:"100%",textAlign:"left",padding:"0.7rem 0.75rem",borderRadius:8,border:"none",cursor:"pointer",background:active?"rgba(167,139,218,0.16)":"transparent",display:"flex",alignItems:"center",gap:"0.7rem",marginBottom:"0.2rem"}},
            h('span',{style:{fontSize:12,fontWeight:800,color:active?C.sidebarActive:C.sidebarMuted,minWidth:20}},ch.num),
            h('span',{style:{flex:1,fontSize:13.5,fontWeight:active?600:400,color:active?"#fff":C.sidebarText}},ch.short)
          );
        })
      ),
      h('div',{style:{padding:"1rem 1.2rem",borderTop:"1px solid "+C.sidebarLine,fontSize:11.5,color:C.sidebarMuted}},"Sophie & Theresa")
    )
  );
}

function App(){
  var s1=useState(null);var activeIdx=s1[0];var setActiveIdx=s1[1];
  var s2=useState(false);var drawerOpen=s2[0];var setDrawerOpen=s2[1];
  var s3=useState(window.innerWidth>=768);var isDesktop=s3[0];var setIsDesktop=s3[1];
  var contentRef=useRef(null);
  useEffect(function(){function handler(){setIsDesktop(window.innerWidth>=768);}window.addEventListener('resize',handler);return function(){window.removeEventListener('resize',handler);};},[]);
  function selectChapter(i){setActiveIdx(i);if(contentRef.current)contentRef.current.scrollTop=0;}
  function goHome(){setActiveIdx(null);if(contentRef.current)contentRef.current.scrollTop=0;}
  var chapter=activeIdx!==null?CHAPTERS[activeIdx]:null;
  var contentEl=h('div',{ref:contentRef,style:{flex:1,overflowY:"auto",overflowX:"hidden",padding:isDesktop?"2rem 2.5rem":"1.2rem 1rem 5rem",width:"100%",maxWidth:isDesktop?760:"100%",minWidth:0}},
    activeIdx===null?h(HomeView,{onSelect:selectChapter}):h(ChapterView,{chapter:chapter,isDesktop:isDesktop,onPrev:activeIdx>0?function(){selectChapter(activeIdx-1);}:null,onNext:activeIdx<CHAPTERS.length-1?function(){selectChapter(activeIdx+1);}:null,prevChapter:activeIdx>0?CHAPTERS[activeIdx-1]:null,nextChapter:activeIdx<CHAPTERS.length-1?CHAPTERS[activeIdx+1]:null})
  );
  if(isDesktop){
    return h('div',{style:{display:"flex",height:"100vh",background:C.bg,color:C.ink}},
      h(Sidebar,{activeIdx:activeIdx,onSelect:selectChapter,onHome:goHome}),
      h('div',{style:{flex:1,overflowY:"auto",background:C.bgDeep,display:"flex",justifyContent:"center"}},contentEl)
    );
  }
  return h('div',{style:{height:"100vh",width:"100%",maxWidth:"100%",overflowX:"hidden",display:"flex",flexDirection:"column",background:C.bg,color:C.ink}},
    h(MobileTopbar,{title:chapter?chapter.short:"Hundetraining",onMenuToggle:function(){setDrawerOpen(true);},showBack:activeIdx!==null,onBack:goHome}),
    h(MobileDrawer,{open:drawerOpen,onClose:function(){setDrawerOpen(false);},activeIdx:activeIdx,onSelect:selectChapter}),
    contentEl
  );
}

var root=ReactDOM.createRoot(document.getElementById('root'));
root.render(h(App,null));

})();
</script>
</body>
</html>
